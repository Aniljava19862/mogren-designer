<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MOGREN Mockup Color Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .mockup {
      position: relative;
      width: 500px;
      height: 500px;
    }

    .base-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .color-layer {
      position: absolute;
      inset: 0;

      background: #18aeea;

      -webkit-mask-image: url("/mockups/women-tshirt-front.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/mockups/women-tshirt-front.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      mix-blend-mode: multiply;
      opacity: 0.8;

      pointer-events: none;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="color"] {
      width: 60px;
      height: 45px;
      border: 0;
      cursor: pointer;
    }

    #colorValue {
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="mockup">
    <img
      src="/mockups/women-tshirt-front.png"
      class="base-image"
      alt="Women T-Shirt"
    />

    <div
      id="colorLayer"
      class="color-layer"
    ></div>
  </div>

  <div class="controls">

    <label>
      Garment Color:
    </label>

    <input
      id="colorPicker"
      type="color"
      value="#18aeea"
    />

    <span id="colorValue">
      #18aeea
    </span>

  </div>

  <script>
    const picker =
      document.getElementById("colorPicker");

    const layer =
      document.getElementById("colorLayer");

    const value =
      document.getElementById("colorValue");

    picker.addEventListener(
      "input",
      (event) => {

        const color =
          event.target.value;

        layer.style.backgroundColor =
          color;

        value.textContent =
          color;
      }
    );
  </script>

</body>
</html>
